<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Converter</title>
  <style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 20px;
    background-color: #f8f9fa; /* Latar belakang halaman */
    color: #333; /* Warna teks default */
  }
  .converter {
    margin: 20px auto;
    padding: 20px;
    border-radius: 10px;
    max-width: 400px;
    background: linear-gradient(135deg, #89cff0, #ffddc1); /* Latar belakang gradasi cerah */
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Efek bayangan */
    color: #333; /* Warna teks dalam kotak */
  }
  label, select, input {
    display: block;
    margin: 10px auto;
    width: 80%; /* Lebar elemen input */
    text-align: left;
    font-size: 16px;
  }
  input {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 5px;
  }
  select {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 5px;
    background-color: #fff;
  }
  button {
    padding: 10px 20px;
    font-size: 16px;
    border: none;
    border-radius: 5px;
    background-color: #ff7f50; /* Warna oranye cerah */
    color: #fff;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  button:hover {
    background-color: #ff6347; /* Warna lebih gelap saat hover */
  }
  .result {
    margin-top: 15px;
    font-weight: bold;
    font-size: 18px;
    color: #222; /* Warna teks hasil */
  }
</style>

  </style>
</head>
<body>
  <h1>Unit Converter</h1>

  <div class="converter">
    <label for="value">Enter Value:</label>
    <input type="number" id="value" placeholder="Enter a number">
    
    <label for="conversion-type">Select Conversion Type:</label>
    <select id="conversion-type">
      <option value="c-to-f">Celsius to Fahrenheit</option>
      <option value="f-to-c">Fahrenheit to Celsius</option>
      <option value="m-to-km">Meter to Kilometer</option>
      <option value="km-to-m">Kilometer to Meter</option>
      <option value="kg-to-lb">Kilogram to Pound</option>
      <option value="lb-to-kg">Pound to Kilogram</option>
    </select>
    
    <button id="convert-btn">Convert</button>
    <div class="result" id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
